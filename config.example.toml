# -----------------------------------------------------------------------------
# Speech, Subtitles, and Video Rendering
# -----------------------------------------------------------------------------

mimo_tts_model_name = "mimo-v2.5-tts"
mimo_tts_style_prompt = "Read in a natural, clear documentary voice suitable for short-form video."

# Subtitle provider: "edge" or "whisper".
subtitle_provider = "edge"

# FFmpeg executable path (leave empty for auto-detection)
# ffmpeg_path = ""

# Video codec override (leave empty for auto libx264 / NVENC detection)
# video_codec = "libx264"

# -----------------------------------------------------------------------------
# Storage and Task Runtime
# -----------------------------------------------------------------------------

endpoint = ""
material_directory = ""

enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

max_concurrent_tasks = 5
max_queued_tasks = 100

# -----------------------------------------------------------------------------
# Cross-platform Social Media Publishing
# -----------------------------------------------------------------------------

upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
upload_post_platforms = ["tiktok", "instagram"]
upload_post_auto_upload = false
upload_post_youtube_privacy_status = "public"
upload_post_max_pending_tasks = 10

# =============================================================================
# Whisper Subtitles
# =============================================================================

[whisper]
model_size = "large-v3"
device = "cpu"
compute_type = "int8"

# =============================================================================
# Material Request Proxy
# =============================================================================

[proxy]
# http = "http://127.0.0.1:3128"
# https = "http://127.0.0.1:1080"

# =============================================================================
# TTS Providers (Voice Synthesis)
# =============================================================================
